service: doc-processing-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ap-south-1
  memorySize: 512
  timeout: 30

  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    S3_BUCKET_NAME: doc-processing-bucket-ananya
    DYNAMODB_TABLE_DOCUMENTS: DocumentsTable
    DYNAMODB_TABLE_EVENTS: EventHistoryTable
    DYNAMODB_TABLE_USERS: UsersTable
    SQS_QUEUE_URL: !Ref DocumentProcessingQueue
    JWT_SECRET: ${env:JWT_SECRET, 'super-secret-jwt-key-for-dev'}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/DocumentsTable
            - arn:aws:dynamodb:${self:provider.region}:*:table/EventHistoryTable
            - arn:aws:dynamodb:${self:provider.region}:*:table/UsersTable
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::doc-processing-bucket-ananya/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt DocumentProcessingQueue.Arn
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - arn:aws:sns:${self:provider.region}:*:doc-processing-alerts

functions:
  api:
    handler: handler.api
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY

  sqsProcessor:
    handler: src/lambdas/sqsProcessor.handler
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt DocumentProcessingQueue.Arn
          batchSize: 1
          maximumRetryAttempts: 3

resources:
  Resources:
    DocumentProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: doc-processing-queue-${self:provider.stage}.fifo
        FifoQueue: true
        ContentBasedDeduplication: true
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
          maxReceiveCount: 3

    DeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: doc-processing-dlq-${self:provider.stage}.fifo
        FifoQueue: true
        ContentBasedDeduplication: true
        MessageRetentionPeriod: 1209600

plugins:
  - serverless-offline
